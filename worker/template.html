<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title><!--TITLE--></title>
  <link rel="icon" href="<!--FAVICON-->" type="image/png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <!--FONTS-->
  <link rel="stylesheet" href="https://craft-catalog-engine.pages.dev/v1/catalog.css"/>
  <style id="craft-vars"><!--VARS--></style>
  <style><!--THEME--></style>
</head>

<body>
  <!-- HERO -->
  <section class="hero">
    <div class="hero-top">
      <div class="brand">
        <img class="brand-logo" id="brandLogo" src="<!--LOGO-->" alt="" onerror="this.style.display='none';document.getElementById('brandName').hidden=false"/>
        <div class="brand-name" id="brandName" hidden><!--BRAND--></div>
        <div class="brand-sub" style="margin-left:2px"><!--BRANDSUB--></div>
      </div>
    </div>
    <!--DIVIDER-->
    <!--KICKER-->
    <h1 id="heroTitle"><!--HERO--></h1>
    <div class="notice" id="heroNotice" style="display:none"></div>
  </section>

  <!-- STICKY SEARCH + CATEGORIES -->
  <div class="sticky-bar">
    <div class="sticky-inner">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="searchInput" type="search" placeholder="<!--SEARCHPH-->" autocomplete="off"/>
      </div>
      <div class="cat-strip" id="catStrip"></div>
    </div>
  </div>

  <!-- CATALOG -->
  <main id="catalog"></main>

  <footer><p id="footerText"></p></footer>

  <!-- Legal modal -->
  <div class="legal-overlay" id="legalOverlay">
    <div class="legal-modal">
      <div class="legal-header">
        <h3 id="legalTitle"></h3>
        <button id="legalClose" aria-label="Cerrar">✕</button>
      </div>
      <div class="legal-body" id="legalBody"></div>
    </div>
  </div>

  <!-- WHATSAPP BUBBLE (el motor setea el href desde config) -->
  <a class="wa-float" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <!-- MINI CART PEEK -->
  <button class="cart-peek" id="cartPeek">
    <span class="pk-left"><span class="pk-count" id="peekCount">0</span> Ver mi carrito</span>
    <span class="pk-right" id="peekTotal">$0</span>
  </button>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg>
      Inicio
    </button>
    <button class="nav-item" data-nav="offers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.3l-8.3 8.3a1.8 1.8 0 01-2.5 0L3 13.8V4h9.8l7.8 7.8a1 1 0 010 1.5z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
      Ofertas
    </button>
    <button class="nav-item" data-nav="cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      Carrito
      <span class="nav-badge" id="navBadge">0</span>
    </button>
    <button class="nav-item" data-nav="location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1116 0z"/><circle cx="12" cy="10" r="2.5"/></svg>
      Ubicación
    </button>
  </nav>

  <!-- CART SHEET -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-handle"></div>
    <div class="cart-header">
      <button class="cart-back" id="cartBack" style="display:none" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>
      <h2 id="cartTitle">Tu Pedido</h2>
      <button class="cart-close" id="cartClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span class="cart-total-label">Total</span>
        <span class="cart-total-value" id="cartTotal">$0</span>
      </div>
      <div class="cart-total-items" id="cartItemCount">0 items</div>
      <button class="btn-next" id="btnCheckout" disabled>
        Realizar pedido
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <!-- STEP 2: DELIVERY DATA -->
    <div class="cart-step2" id="cartStep2">
      <div class="step2-body">
        <div class="delivery-toggle" id="deliveryToggle">
          <button class="dtog-btn active" data-mode="delivery">Domicilio</button>
          <button class="dtog-btn" data-mode="pickup">Retiro en local</button>
        </div>
        <div class="form-field">
          <label>Nombre y Apellido</label>
          <input type="text" id="fieldName" placeholder="Ej: María González" autocomplete="name">
        </div>
        <div class="form-field">
          <label>Teléfono</label>
          <input type="tel" id="fieldPhone" placeholder="Ej: 0991234567" autocomplete="tel">
        </div>
        <div class="form-field" id="fieldAddressWrap">
          <label>Dirección de entrega</label>
          <textarea id="fieldAddress" rows="3" placeholder="Sector, calles, número de casa y referencia..."></textarea>
        </div>
      </div>
      <div class="step2-footer">
        <button class="btn-whatsapp" id="btnConfirm">
          <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Confirmar pedido por WhatsApp
        </button>
      </div>
    </div>
  </aside>

  <!-- PRODUCT MODAL -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
    <div class="modal" id="modal">
      <button class="modal-fav" id="modalFav" aria-label="Favorito">♡</button>
      <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
      <div class="slider-wrap" id="sliderWrap">
        <div class="slider-track" id="sliderTrack"></div>
        <button class="slider-btn prev" id="sliderPrev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="slider-btn next" id="sliderNext" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>
        <div class="slider-dots" id="sliderDots"></div>
      </div>
      <div class="modal-detail" id="modalDetail"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script><!--CONFIG--></script>
  <script src="https://craft-catalog-engine.pages.dev/v1/catalog.js" defer></script>
</body>
</html>
