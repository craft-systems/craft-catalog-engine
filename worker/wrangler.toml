name = "craft-menus"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Routes: uno específico por menú ({slug}.craft-systems.com/*), creado por el onboarding
# de craft-crm vía API (CreateMenuRoute). NO declarar routes aquí ni usar wildcard:
# el wildcard taparía media.craft-systems.com (R2 custom domain) y rutearía toda la media
# por el Worker (rompe el modelo de costos a escala). Sin `routes` en este toml, `wrangler
# deploy` no toca los routes creados por API — persisten en la zona.

# KV con los datos de cada menú: {slug}:config, {slug}:productos, {slug}:theme, domain:{host}.
# El id sale de: Cloudflare → Workers & Pages → KV → namespace "MENUS".
[[kv_namespaces]]
binding = "MENUS"
id = "5d6c441b24004512a8d29c1261608f6e"

# Permite importar template.html como string (SSR del shell).
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
